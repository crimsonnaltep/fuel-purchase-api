{% extends "base.html" %}
{% block content %}
    <a class="text-link" href="{{ url(back) }}">← Back</a>
    <header class="page-head">
        <div>
            <h1>{{ title }}</h1>
            <p class="muted">Review the details before saving.</p>
        </div>
    </header>
    <section class="panel form-panel">
        <form method="post">
            {{ csrf_input }}
            {{ form.as_p() }}
            <div class="form-actions">
                <button class="button">Save changes</button>
                <a class="text-link" href="{{ url(back) }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
